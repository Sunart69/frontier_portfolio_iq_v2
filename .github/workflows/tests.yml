name: Tests

on:
  push:
    branches: [main]
    paths: ["frontier_portfolio_iq/**", "tests/**", "cadence/**", "config/**", "pyproject.toml"]
  pull_request:
    paths: ["frontier_portfolio_iq/**", "tests/**", "cadence/**", "config/**", "pyproject.toml"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[test]"
      - run: pytest -q --durations=15
