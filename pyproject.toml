[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frontier-portfolio-iq"
version = "2.0.0"
description = "Enterprise portfolio decision intelligence: multi-LOB, ring-fenced capacity optimization with multi-solver validation, Pareto frontiers and Monte Carlo risk"
requires-python = ">=3.10"
dependencies = [
  "pulp>=2.8,<3",          # model building (and the bundled CBC binary)
  "highspy>=1.7",          # HiGHS: primary LP/MILP engine
  "pyscipopt>=5.0",        # SCIP: independent MILP validation
  "ortools>=9.10",         # OR-Tools CP-SAT: discrete scheduling reformulation
  "numpy>=1.26",
  "scipy>=1.11",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "python-docx>=1.1",
  "pyyaml>=6",
]

[project.optional-dependencies]
nsga = ["pymoo>=0.6.1"]    # optional NSGA-II search
qp = ["osqp>=0.6.5"]       # optional OSQP resource leveling
test = ["pytest>=8", "pymoo>=0.6.1", "osqp>=0.6.5"]
all = ["pymoo>=0.6.1", "osqp>=0.6.5"]

[project.scripts]
frontier-portfolio-iq = "frontier_portfolio_iq.cli:main"

[tool.setuptools]
packages = ["frontier_portfolio_iq", "frontier_portfolio_iq.cadence", "frontier_portfolio_iq.solvers",
            "frontier_portfolio_iq.pareto", "frontier_portfolio_iq.risk", "frontier_portfolio_iq.decision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: full sample-portfolio analysis (slower)"]
